<section class="contact-section">
  <div class="contact-copy">
    <span>Contact</span>
    <h2>Heb je een vraag of wil je gewoon even contact opnemen?</h2>
    <p>
      Stuur gerust een bericht. Ik lees het zelf en probeer zo snel mogelijk te
      reageren.
    </p>
  </div>

  <form #contactForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="row">
      <label
        >Voornaam<input
          type="text"
          name="firstName"
          [(ngModel)]="contact.firstName"
          #firstName="ngModel"
          autocomplete="given-name"
          required
      /></label>
      <label
        >Achternaam<input
          type="text"
          name="lastName"
          [(ngModel)]="contact.lastName"
          #lastName="ngModel"
          autocomplete="family-name"
          required
      /></label>
    </div>
    <div class="row">
      <label
        >Bedrijfsnaam<input
          type="text"
          name="company"
          [(ngModel)]="contact.company"
          #company="ngModel"
          autocomplete="organization"
          required
      /></label>
      <label
        >Aantal medewerkers
        <select
          name="employeeCount"
          [(ngModel)]="contact.employeeCount"
          #employeeCount="ngModel"
          required
        >
          <option
            *ngFor="let option of employeeCounts"
            [ngValue]="option.index"
          >
            {{ option.label | employeeEnum }}
          </option>
        </select>
      </label>
    </div>
    <label
      >Bedrijfsinformatie<textarea
        name="companyInfo"
        [(ngModel)]="contact.companyInformation"
        #companyInfo="ngModel"
        rows="4"
        required
      ></textarea>
    </label>
    <div class="row">
      <label
        >E-mail<input
          type="email"
          name="email"
          [(ngModel)]="contact.email"
          #email="ngModel"
          autocomplete="email"
          required
          email
      /></label>
      <label
        >Telefoonnummer <small>(optioneel)</small
        ><input
          type="tel"
          name="phone"
          [(ngModel)]="contact.phone"
          #phone="ngModel"
          autocomplete="tel"
          pattern="^[0-9\-\+ ]{7,15}$"
      /></label>
    </div>
    <label
      >Extra informatie<textarea
        name="message"
        [(ngModel)]="contact.message"
        #message="ngModel"
        rows="5"
      ></textarea>
    </label>
    <div class="form-footer">
      <p *ngIf="contactForm.invalid && contactForm.submitted">
        Controleer even of alle verplichte velden goed zijn ingevuld.
      </p>
      <button type="submit" [disabled]="contactForm.invalid">
        Versturen <span>→</span>
      </button>
    </div>
  </form>

  <button
    class="contact-admin-trigger"
    type="button"
    (click)="openContactList()"
    aria-label="Contactbeheer openen"
    title="Contactbeheer"
  >
    beheer
  </button>
</section>
